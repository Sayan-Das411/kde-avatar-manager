name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (dbus, PyQt5 headless)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev \
            libglib2.0-dev \
            python3-dbus \
            python3-pyqt5 \
            libpython3-dev \
            xvfb

      - name: Install package + dev dependencies
        # dbus-python and PyQt5 come from system apt; install everything else via pip.
        run: |
          pip install click "Pillow>=9.0" "rich>=12.0" "pytest>=7.0" "hypothesis>=6.0"
          pip install -e . --no-deps

      - name: Run tests
        # xvfb-run makes Qt happy in headless CI (needed for editor tests).
        # PYTHONPATH includes system site-packages so that dbus and PyQt5,
        # installed via apt, are visible to the setup-python managed interpreter.
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: xvfb-run -a python -m pytest tests/ -q --tb=short

  typecheck:
    name: mypy type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libglib2.0-dev python3-dbus python3-pyqt5 libpython3-dev

      - name: Install package + typecheck dependencies
        run: |
          pip install click "Pillow>=9.0" "rich>=12.0" "mypy>=1.0"
          pip install -e . --no-deps

      - name: Run mypy
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: python -m mypy kdam/ --ignore-missing-imports

  lint:
    name: ruff lint + format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check kdam/ tests/

      - name: Format check
        run: ruff format --check kdam/ tests/
